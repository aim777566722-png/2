name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN GitHub secret is missing"; exit 1; }
          npx wrangler whoami

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          npx wrangler deploy --config cloudflare/wrangler.toml

      - name: Verify Worker health endpoint
        run: |
          set -e
          URL="https://document-ai-api.aim777566722.workers.dev/api/health"
          curl --fail --show-error --silent --location --retry 10 --retry-delay 5 --connect-timeout 10 --max-time 30 "$URL"
          echo
          echo "Worker health check passed."

      - name: Verify Gemini parse endpoint (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -e
          URL="https://document-ai-api.aim777566722.workers.dev/api/parse-document"
          BODY='{"documentType":"order","extractionMode":"pure_text","fileName":"smoke-test.txt","fileText":"Panadol 500mg x 2"}'
          RESPONSE=$(curl --show-error --silent --location --connect-timeout 10 --max-time 120 -H "Content-Type: application/json" -d "$BODY" -w '\nHTTP_STATUS:%{http_code}' "$URL")
          echo "$RESPONSE"
          STATUS=$(printf '%s' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          if [ "$STATUS" != "200" ]; then exit 1; fi
          printf '%s' "$RESPONSE" | grep -q '"success":true'
          echo "Gemini parse endpoint passed."

  verify-live-api:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() }}
    steps:
      - name: Verify live Worker health independently
        run: |
          set -e
          URL="https://document-ai-api.aim777566722.workers.dev/api/health"
          RESPONSE=$(curl --show-error --silent --location --connect-timeout 10 --max-time 30 -w '\nHTTP_STATUS:%{http_code}' "$URL")
          echo "$RESPONSE"
          STATUS=$(printf '%s' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          if [ "$STATUS" != "200" ]; then exit 1; fi
          printf '%s' "$RESPONSE" | grep -q '"ok":true'

      - name: Verify live Worker Gemini parsing independently (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -e
          URL="https://document-ai-api.aim777566722.workers.dev/api/parse-document"
          BODY='{"documentType":"order","extractionMode":"pure_text","fileName":"live-test.txt","fileText":"Panadol 500mg x 2"}'
          RESPONSE=$(curl --show-error --silent --location --connect-timeout 10 --max-time 120 -H "Content-Type: application/json" -d "$BODY" -w '\nHTTP_STATUS:%{http_code}' "$URL")
          echo "$RESPONSE"
          STATUS=$(printf '%s' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          if [ "$STATUS" != "200" ]; then exit 1; fi
          printf '%s' "$RESPONSE" | grep -q '"success":true'

      - name: Verify Google Apps Script proxy routing
        run: |
          set -e
          URL="https://script.google.com/macros/s/AKfycbzd7akKXUtARy835P5248J9eaJel54wjGqXGNAsa6GJtoYjE3Ssf159FqaJpR1Kxzt6bA/exec?route=api%2Fhealth"
          RESPONSE=$(curl --show-error --silent --location --connect-timeout 15 --max-time 60 -w '\nHTTP_STATUS:%{http_code}' "$URL")
          echo "$RESPONSE"
          STATUS=$(printf '%s' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          if [ "$STATUS" != "200" ]; then exit 1; fi
          printf '%s' "$RESPONSE" | grep -q '"ok":true'
          echo "Apps Script proxy routing passed."
