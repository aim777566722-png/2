name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, codex-full-fix]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN GitHub secret is missing"; exit 1; }
          npx wrangler whoami
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config cloudflare/wrangler.toml
      - name: Verify Worker health endpoint
        run: |
          set -e
          URL="https://document-ai-api.aim777566722.workers.dev/api/health"
          curl --fail --show-error --silent --location --retry 10 --retry-delay 5 --connect-timeout 10 --max-time 30 "$URL"
      - name: Verify all API routes
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex-full-fix' }}
        run: |
          set -e
          URL="https://document-ai-api.aim777566722.workers.dev"
          for ROUTE in parse-document parse-order parse-invoice refine-text match-order-invoice; do
            BODY='{"documentType":"order","extractionMode":"pure_text","fileName":"route-test.txt","fileText":"Panadol 500mg x 2"}'
            RESPONSE=$(curl --show-error --silent --location --connect-timeout 10 --max-time 120 -H "Content-Type: application/json" -d "$BODY" -w '\nHTTP_STATUS:%{http_code}' "$URL/api/$ROUTE")
            echo "$ROUTE: $RESPONSE"
            STATUS=$(printf '%s' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
            [ "$STATUS" = "200" ]
            printf '%s' "$RESPONSE" | grep -q '"success":true'
          done
