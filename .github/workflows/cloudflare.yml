name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify Worker files
        run: |
          test -f cloudflare/wrangler.toml
          test -f cloudflare/cloudflare-worker.ts
          wrangler deploy --help >/dev/null

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config cloudflare/wrangler.toml

      - name: Verify Worker health endpoint
        run: |
          set -e
          URL="https://document-ai-api.aim777566722.workers.dev/api/health"
          echo "Checking: $URL"
          curl --fail --show-error --silent --location --retry 10 --retry-delay 5 --connect-timeout 10 --max-time 30 "$URL"
          echo
          echo "Worker health check passed."

      - name: Verify Gemini parse endpoint
        run: |
          set -e
          URL="https://document-ai-api.aim777566722.workers.dev/api/parse-document"
          echo "Checking Gemini parse endpoint..."
          BODY='{"documentType":"order","extractionMode":"pure_text","fileName":"smoke-test.txt","fileText":"Panadol 500mg x 2"}'
          RESPONSE=$(curl --show-error --silent --location \
            --connect-timeout 10 --max-time 90 \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -w '\nHTTP_STATUS:%{http_code}' \
            "$URL")
          echo "$RESPONSE"
          STATUS=$(printf '%s' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          if [ "$STATUS" != "200" ]; then
            echo "Gemini parse endpoint returned HTTP $STATUS"
            exit 1
          fi
          printf '%s' "$RESPONSE" | grep -q '"success":true'
          echo "Gemini parse endpoint passed."
