name: Apply Universal PDF Parser Fix
on:
  push:
    branches: [codex-full-fix]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-full-fix
          fetch-depth: 0
      - name: Patch PDF extraction pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/utils/documentParser.ts')
          s = p.read_text()
          s = s.replace('const numPages = Math.min(pdf.numPages, 10);', 'const numPages = pdf.numPages;', 1)
          s = s.replace("tableData: hasGenuineTable ? pdfContent.matrix : undefined,\n      rawMatrix: hasGenuineTable ? pdfContent.matrix : undefined,\n      mimeType: 'image/jpeg',", "tableData: pdfContent.matrix.length > 0 ? pdfContent.matrix : undefined,\n      rawMatrix: pdfContent.matrix.length > 0 ? pdfContent.matrix : undefined,\n      mimeType: 'application/pdf',", 1)
          p.write_text(s)

          w = Path('cloudflare/cloudflare-worker.ts')
          ws = w.read_text()
          ws = ws.replace('for (const image of images.slice(0, 12)) parts.push({ inline_data: { mime_type: image.mimeType, data: image.base64 } });', 'for (const image of images) parts.push({ inline_data: { mime_type: image.mimeType, data: image.base64 } });', 1)
          w.write_text(ws)

          # Remove the known unsafe local-result replacement only when its exact form exists.
          b = Path('src/context/BackgroundAnalysisContext.tsx')
          bs = b.read_text()
          old = "if (fullExtractedTableRows.length > 0 && extracted.items.length === 0) {"
          if old in bs:
              start = bs.index(old)
              end = bs.index('\n        }', start) + len('\n        }')
              bs = bs[:start] + bs[end:]
          b.write_text(bs)
          print('PDF parser, worker page coverage, and local fallback hardening applied')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/documentParser.ts cloudflare/cloudflare-worker.ts src/context/BackgroundAnalysisContext.tsx
          git diff --cached --quiet && echo 'No source changes required' || git commit -m 'fix: harden universal PDF extraction [pdf-fix-applied]'
          git push origin HEAD:codex-full-fix
      - name: Remove patch workflow
        if: always()
        run: |
          git fetch origin codex-full-fix
          git reset --hard origin/codex-full-fix
          rm -f .github/workflows/codex-pdf-universal-fix.yml
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary PDF patch workflow [pdf-fix-applied]'
          git push origin HEAD:codex-full-fix || true
