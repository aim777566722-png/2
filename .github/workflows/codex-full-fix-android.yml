name: Build Android APK - codex-full-fix

on:
  push:
    branches:
      - codex-full-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Capacitor Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Gradle 8.13
        run: |
          curl --fail --location --retry 3 -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.13/bin/gradle --version

      - name: Regenerate Gradle Wrapper
        working-directory: android
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Clean Android Build
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-codex-full-fix
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
