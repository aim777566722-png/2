name: Codex extraction fix
on:
  push:
    branches: [codex-full-fix]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-full-fix
          fetch-depth: 1
      - name: Apply extraction safeguards
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/utils/documentParser.ts')
          s = p.read_text()
          anchor = "function isHeaderOrJunk(name: string): boolean {"
          helper = r'''function isOcrNoiseLike(val: any): boolean {
            const s = String(val ?? '').trim();
            if (!s) return true;
            if (/^\d{1,2}\s*\/\s*\d{1,2}:\d{2}(?::\d{2})?\s*(?:am|pm|ص|م)?$/i.test(s)) return true;
            if (/^(?:https?:\/\/|www\.|(?:www\s*[.]\s*)?\w+[.]\w{2,})(?:[/?#].*)?$/i.test(s)) return true;
            if (/^(?:www|http|https|ftp|com|net|org)$/i.test(s)) return true;
            return false;
          }
          if 'function isOcrNoiseLike' not in s:
              if anchor not in s: raise SystemExit('parser anchor not found')
              s = s.replace(anchor, helper + anchor, 1)
          marker = "  if (n.length < 2) return true;"
          if "  if (isOcrNoiseLike(n)) return true;" not in s:
              pos = s.find(marker)
              if pos < 0: raise SystemExit('header guard not found')
              s = s[:pos] + marker + "\n  if (isOcrNoiseLike(n)) return true;" + s[pos + len(marker):]
          marker2 = "    if (!cell) return;"
          if "    if (isOcrNoiseLike(cell)) return;" not in s:
              pos = s.find(marker2)
              if pos < 0: raise SystemExit('cell guard not found')
              s = s[:pos] + marker2 + "\n    if (isOcrNoiseLike(cell)) return;" + s[pos + len(marker2):]
          p.write_text(s)

          p = Path('src/context/BackgroundAnalysisContext.tsx')
          s = p.read_text()
          old = """        if (hasLargeExcelDataset && fullExtractedTableRows.length > validatedExtractedItems.length) {
          extracted.items = fullExtractedTableRows;
          extracted.summary = `تم استخراج كافة الـ ${fullExtractedTableRows.length} صنفاً من الجدول المحلي.`;
        } else {
          extracted.items = validatedExtractedItems.length > 0 ? validatedExtractedItems : fullExtractedTableRows;
        }
"""
          new = """        if (analysisMode === 'local') {
          extracted.items = validatedExtractedItems;
          if (validatedExtractedItems.length === 0) {
            extracted.summary = 'لم يتم العثور على صفوف دوائية موثوقة في التحليل المحلي؛ لم يتم استبدال النتيجة ببيانات OCR غير موثوقة.';
          }
        } else if (hasLargeExcelDataset && fullExtractedTableRows.length > validatedExtractedItems.length) {
          extracted.items = fullExtractedTableRows;
          extracted.summary = `تم استخراج كافة الـ ${fullExtractedTableRows.length} صنفاً من الجدول المحلي.`;
        } else {
          extracted.items = validatedExtractedItems.length > 0 ? validatedExtractedItems : fullExtractedTableRows;
        }
"""
          if old not in s: raise SystemExit('background extraction fallback block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/documentParser.ts src/context/BackgroundAnalysisContext.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden OCR row extraction'
          git push origin codex-full-fix
