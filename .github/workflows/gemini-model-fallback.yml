name: Apply Gemini model fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fallback:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch to stable Gemini fallback model when needed
        run: |
          set -e
          FILE="cloudflare/cloudflare-worker.ts"
          if grep -q "const GEMINI_MODEL = 'gemini-3.6-flash';" "$FILE"; then
            sed -i "s/const GEMINI_MODEL = 'gemini-3.6-flash';/const GEMINI_MODEL = 'gemini-2.5-flash';/" "$FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "Use Gemini 2.5 Flash fallback for API quota reliability"
            git push
          else
            echo "No model fallback change required."
          fi
